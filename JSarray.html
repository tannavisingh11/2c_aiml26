<!DOCTYPE html>
<head>
    <title>JavaScript Array Methods</title>

    <script>
        let a = [1, 2, 3, 4, 5];
        document.write(a + "<br>");
        console.log(a);
        let l = a.push(6);
        document.write(l + "<br>");
        console.log(l);
        let m = a.pop();
        document.write(m + "<br>");
        console.log(a.length);
        let d = a.shift();
        document.write(d + "<br>");
        console.log(d);
        let e = a.unshift(0);
        document.write(e + "<br>");
        console.log(e);
        let f = a.slice(1, 4);
        document.write(f + "<br>");
        console.log(f.length);
        let g = a.splice(1, 2, 8, 9);
        document.write(g + "<br>");
        console.log(g.length);
        let h = a.reverse();
        document.write(h + "<br>");
        console.log(a.length);
        document.write("Final array: " + a + "<br>");
        console.log("Final array:", a);
    </script>
</head>

<body>
</body>
</html>
