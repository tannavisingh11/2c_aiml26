<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    //let a= new Array()
    //let b= new Array(1,2,3,4,5)
    let arr = [10, 20, 30, 40];

console.log("Original Array:", arr);

// 1. push() - Add element at end
arr.push(50);
console.log("After push:", arr);

// 2. pop() - Remove last element
arr.pop();
console.log("After pop:", arr);

// 3. concat() - Join two arrays
let arr2 = [60, 70];
let newArr = arr.concat(arr2);
console.log("After concat:", newArr);

// 4. length - Count elements
console.log("Length of array:", arr.length);

// 5. unshift() - Add element at beginning
arr.unshift(5);
console.log("After unshift:", arr);

// 6. shift() - Remove first element
arr.shift();
console.log("After shift:", arr);

// 7. slice() - Copy part of array
let sliced = arr.slice(1, 3);
console.log("Slice (1,3):", sliced);

// 8. splice() - Add/Remove elements
arr.splice(2, 1, 99); // index 2, remove 1, add 99
console.log("After splice:", arr);

// 9. reverse() - Reverse array
arr.reverse();
console.log("After reverse:", arr);

//10.tostring() - 
arr.tostring();
console.log("after tostring:",arr);
</script>
<body>
    
</body>
</html>
