<!DOCTYPE html>
<html>
<head>
  <title>Simple Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .form-box {
      width: 300px;
      margin: 0 auto;
    }
    input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: green;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="form-box">
    <h2>Register</h2>
    <form onsubmit="return validateForm()">
      
      <label>Name:</label>
      <input type="text" id="name">

      <label>Email:</label>
      <input type="text" id="email">

      <label>Password:</label>
      <input type="password" id="password">

      <label>Re-enter Password:</label>
      <input type="password" id="repass">

      <label>Mobile No:</label>
      <input type="text" id="mobile">

      <button type="submit">Submit</button>

    </form>
  </div>

  <script>
    function validateForm() {
      // 1. Get values from inputs
      var name = document.getElementById("name").value;
      var email = document.getElementById("email").value;
      var pass = document.getElementById("password").value;
      var repass = document.getElementById("repass").value;
      var mobile = document.getElementById("mobile").value;

      // 2. Check Name (Only letters allowed)
      if (isNaN(name) == false) {
        alert("Please enter a valid text name (No numbers allowed).");
        return false;
      }

      // 3. Check Email (Must contain @ and .)
      if (email.indexOf("@") == -1 || email.indexOf(".") == -1) {
        alert("Please enter a valid Email address containing @ and .");
        return false;
      }

      // 4. Check Password length
      if (pass.length < 6) {
        alert("Password must be at least 6 characters long.");
        return false;
      }

      // 5. Check if Passwords match
      if (pass != repass) {
        alert("Passwords do not match.");
        return false;
      }

      // 6. Check Mobile (Must be numbers and exactly 10 digits)
      if (isNaN(mobile) || mobile.length != 10) {
        alert("Mobile number must be exactly 10 digits.");
        return false;
      }

      // If all checks pass
      alert("Registration Successful!");
      return true;
    }
  </script>

</body>
</html>
