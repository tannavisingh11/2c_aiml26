<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>class</title>
</head>
<body>
  <script>
    class Student{
      constructor(name){
        this.name=name;
      }
      display(){
        console.log(this.name);
      }
    }

    let student1= new Student("vikas");
    let student2= new Student("sachin");
    student1.display();
    student2.display();
  </script>
</body>
</html>
